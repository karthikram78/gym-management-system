{% extends 'base.html' %}

{% block title %}Edit Trainer - IronPulse Gym Management{% endblock %}
{% block page_title %}Update Trainer Profile{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <div class="card-header">
        <h2 class="card-title">
            <i class="fa-solid fa-user-pen"></i> Editing Trainer: {{ trainer.name }} (#{{ trainer.id }})
        </h2>
        <a href="{{ url_for('trainers') }}" class="btn btn-secondary btn-sm">
            <i class="fa-solid fa-arrow-left"></i> Back to Trainers
        </a>
    </div>

    <div class="card-body">
        <form action="{{ url_for('edit_trainer', id=trainer.id) }}" method="POST">
            <div class="form-grid">
                <div class="form-group">
                    <label for="name" class="form-label">Full Name <span class="required">*</span></label>
                    <input type="text" id="name" name="name" class="form-control" value="{{ trainer.name }}" required>
                </div>

                <div class="form-group">
                    <label for="gender" class="form-label">Gender <span class="required">*</span></label>
                    <select id="gender" name="gender" class="form-select" required>
                        <option value="Male" {% if trainer.gender == 'Male' %}selected{% endif %}>Male</option>
                        <option value="Female" {% if trainer.gender == 'Female' %}selected{% endif %}>Female</option>
                        <option value="Other" {% if trainer.gender == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" name="email" class="form-control" value="{{ trainer.email }}" required>
                </div>

                <div class="form-group">
                    <label for="phone" class="form-label">Phone Number <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" class="form-control" value="{{ trainer.phone }}" required>
                </div>

                <div class="form-group">
                    <label for="specialization" class="form-label">Specialization <span class="required">*</span></label>
                    <input type="text" id="specialization" name="specialization" class="form-control" value="{{ trainer.specialization }}" required>
                </div>

                <div class="form-group">
                    <label for="experience" class="form-label">Experience (Years) <span class="required">*</span></label>
                    <input type="number" id="experience" name="experience" class="form-control" min="0" max="50" value="{{ trainer.experience }}" required>
                </div>

                <div class="form-group">
                    <label for="salary" class="form-label">Monthly Salary (₹) <span class="required">*</span></label>
                    <input type="number" step="0.01" id="salary" name="salary" class="form-control" value="{{ trainer.salary }}" required>
                </div>

                <div class="form-group">
                    <label for="joining_date" class="form-label">Joining Date <span class="required">*</span></label>
                    <input type="date" id="joining_date" name="joining_date" class="form-control" value="{{ trainer.joining_date }}" required>
                </div>

                <div class="form-group">
                    <label for="status" class="form-label">Status</label>
                    <select id="status" name="status" class="form-select">
                        <option value="Active" {% if trainer.status == 'Active' %}selected{% endif %}>Active</option>
                        <option value="Inactive" {% if trainer.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('trainers') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-floppy-disk"></i> Save Trainer Details
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
