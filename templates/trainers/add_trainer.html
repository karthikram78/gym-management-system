{% extends 'base.html' %}

{% block title %}Add Trainer - IronPulse Gym Management{% endblock %}
{% block page_title %}Recruit New Trainer{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <div class="card-header">
        <h2 class="card-title">
            <i class="fa-solid fa-user-ninja"></i> Trainer Information
        </h2>
        <a href="{{ url_for('trainers') }}" class="btn btn-secondary btn-sm">
            <i class="fa-solid fa-arrow-left"></i> Back to Trainers
        </a>
    </div>

    <div class="card-body">
        <form action="{{ url_for('add_trainer') }}" method="POST">
            <div class="form-grid">
                <div class="form-group">
                    <label for="name" class="form-label">Full Name <span class="required">*</span></label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Vikram Rathore" required>
                </div>

                <div class="form-group">
                    <label for="gender" class="form-label">Gender <span class="required">*</span></label>
                    <select id="gender" name="gender" class="form-select" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="trainer@ironpulse.com" required>
                </div>

                <div class="form-group">
                    <label for="phone" class="form-label">Phone Number <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="9876543210" required>
                </div>

                <div class="form-group">
                    <label for="specialization" class="form-label">Specialization / Expertise <span class="required">*</span></label>
                    <input type="text" id="specialization" name="specialization" class="form-control" placeholder="e.g. Strength & Hypertrophy" required>
                </div>

                <div class="form-group">
                    <label for="experience" class="form-label">Experience (in Years) <span class="required">*</span></label>
                    <input type="number" id="experience" name="experience" class="form-control" min="0" max="50" value="2" required>
                </div>

                <div class="form-group">
                    <label for="salary" class="form-label">Monthly Salary (₹) <span class="required">*</span></label>
                    <input type="number" step="0.01" id="salary" name="salary" class="form-control" placeholder="e.g. 40000" required>
                </div>

                <div class="form-group">
                    <label for="joining_date" class="form-label">Joining Date <span class="required">*</span></label>
                    <input type="date" id="joining_date" name="joining_date" class="form-control" value="{{ today_ymd }}" required>
                </div>

                <div class="form-group">
                    <label for="status" class="form-label">Status</label>
                    <select id="status" name="status" class="form-select">
                        <option value="Active" selected>Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('trainers') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-check"></i> Register Trainer
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
