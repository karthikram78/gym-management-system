{% extends 'base.html' %}

{% block title %}Edit Plan - IronPulse Gym Management{% endblock %}
{% block page_title %}Update Membership Plan{% endblock %}

{% block content %}
<div class="card" style="max-width: 700px; margin: 0 auto;">
    <div class="card-header">
        <h2 class="card-title">
            <i class="fa-solid fa-pen-to-square"></i> Modify Plan: {{ plan.plan_name }}
        </h2>
        <a href="{{ url_for('plans') }}" class="btn btn-secondary btn-sm">
            <i class="fa-solid fa-arrow-left"></i> Back to Plans
        </a>
    </div>

    <div class="card-body">
        <form action="{{ url_for('edit_plan', id=plan.id) }}" method="POST">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="plan_name" class="form-label">Plan Name <span class="required">*</span></label>
                    <input type="text" id="plan_name" name="plan_name" class="form-control" value="{{ plan.plan_name }}" required>
                </div>

                <div class="form-group">
                    <label for="duration_months" class="form-label">Duration (in Months) <span class="required">*</span></label>
                    <input type="number" id="duration_months" name="duration_months" class="form-control" min="1" max="60" value="{{ plan.duration_months }}" required>
                </div>

                <div class="form-group">
                    <label for="price" class="form-label">Pricing Amount (₹) <span class="required">*</span></label>
                    <input type="number" step="0.01" id="price" name="price" class="form-control" value="{{ plan.price }}" required>
                </div>

                <div class="form-group">
                    <label for="status" class="form-label">Plan Status</label>
                    <select id="status" name="status" class="form-select">
                        <option value="Active" {% if plan.status == 'Active' %}selected{% endif %}>Active</option>
                        <option value="Inactive" {% if plan.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="description" class="form-label">Description & Perks</label>
                    <textarea id="description" name="description" class="form-control" rows="3">{{ plan.description or '' }}</textarea>
                </div>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('plans') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-floppy-disk"></i> Update Plan
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
