{% extends 'base.html' %}

{% block title %}Create Plan - IronPulse Gym Management{% endblock %}
{% block page_title %}Create Membership Plan{% endblock %}

{% block content %}
<div class="card" style="max-width: 700px; margin: 0 auto;">
    <div class="card-header">
        <h2 class="card-title">
            <i class="fa-solid fa-layer-group"></i> Plan Details
        </h2>
        <a href="{{ url_for('plans') }}" class="btn btn-secondary btn-sm">
            <i class="fa-solid fa-arrow-left"></i> Back to Plans
        </a>
    </div>

    <div class="card-body">
        <form action="{{ url_for('add_plan') }}" method="POST">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="plan_name" class="form-label">Plan Name <span class="required">*</span></label>
                    <input type="text" id="plan_name" name="plan_name" class="form-control" placeholder="e.g. Quarterly Pro or Annual VIP" required>
                </div>

                <div class="form-group">
                    <label for="duration_months" class="form-label">Duration (in Months) <span class="required">*</span></label>
                    <input type="number" id="duration_months" name="duration_months" class="form-control" min="1" max="60" value="1" required>
                </div>

                <div class="form-group">
                    <label for="price" class="form-label">Pricing Amount (₹) <span class="required">*</span></label>
                    <input type="number" step="0.01" id="price" name="price" class="form-control" placeholder="1500" required>
                </div>

                <div class="form-group">
                    <label for="status" class="form-label">Plan Status</label>
                    <select id="status" name="status" class="form-select">
                        <option value="Active" selected>Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="description" class="form-label">Description & Perks</label>
                    <textarea id="description" name="description" class="form-control" rows="3" placeholder="Free locker access, free towel, consultation, sauna..."></textarea>
                </div>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('plans') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-check"></i> Save Plan
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
