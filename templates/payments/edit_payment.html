{% extends 'base.html' %}

{% block title %}Edit Payment #{{ payment.id }} - IronPulse Gym Management{% endblock %}
{% block page_title %}Update Payment Record{% endblock %}

{% block content %}
<div class="card max-w-750">
    <div class="card-header">
        <h2 class="card-title">
            <i class="fa-solid fa-pen-to-square"></i> Modify Transaction #{{ payment.id }}
        </h2>
        <a href="{{ url_for('payments') }}" class="btn btn-secondary btn-sm">
            <i class="fa-solid fa-arrow-left"></i> Back to Payments
        </a>
    </div>

    <div class="card-body">
        <form action="{{ url_for('edit_payment', id=payment.id) }}" method="POST">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label class="form-label">Member Name</label>
                    <input type="text" class="form-control readonly-bg" aria-label="Member Name" value="{{ payment.member_name }}" disabled>
                </div>

                <div class="form-group">
                    <label for="amount" class="form-label">Payment Amount (₹) <span class="required">*</span></label>
                    <input type="number" step="0.01" id="amount" name="amount" class="form-control" value="{{ payment.amount }}" required>
                </div>

                <div class="form-group">
                    <label for="payment_date" class="form-label">Payment Date <span class="required">*</span></label>
                    <input type="date" id="payment_date" name="payment_date" class="form-control" value="{{ payment.payment_date }}" required>
                </div>

                <div class="form-group">
                    <label for="payment_method" class="form-label">Payment Method</label>
                    <select id="payment_method" name="payment_method" class="form-select" required>
                        <option value="Cash" {% if payment.payment_method == 'Cash' %}selected{% endif %}>Cash</option>
                        <option value="UPI" {% if payment.payment_method == 'UPI' %}selected{% endif %}>UPI</option>
                        <option value="Card" {% if payment.payment_method == 'Card' %}selected{% endif %}>Card</option>
                        <option value="Bank Transfer" {% if payment.payment_method == 'Bank Transfer' %}selected{% endif %}>Bank Transfer</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="status" class="form-label">Status</label>
                    <select id="status" name="status" class="form-select" required>
                        <option value="Paid" {% if payment.status == 'Paid' %}selected{% endif %}>Paid</option>
                        <option value="Pending" {% if payment.status == 'Pending' %}selected{% endif %}>Pending</option>
                        <option value="Failed" {% if payment.status == 'Failed' %}selected{% endif %}>Failed</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="transaction_id" class="form-label">Transaction Reference</label>
                    <input type="text" id="transaction_id" name="transaction_id" class="form-control" value="{{ payment.transaction_id or '' }}">
                </div>

                <div class="form-group full-width">
                    <label for="notes" class="form-label">Notes</label>
                    <input type="text" id="notes" name="notes" class="form-control" value="{{ payment.notes or '' }}">
                </div>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('payments') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-floppy-disk"></i> Update Transaction
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
