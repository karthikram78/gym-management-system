{% extends 'base.html' %}

{% block title %}Record Payment - IronPulse Gym Management{% endblock %}
{% block page_title %}Record Payment{% endblock %}

{% block content %}
<div class="card" style="max-width: 750px; margin: 0 auto;">
    <div class="card-header">
        <h2 class="card-title">
            <i class="fa-solid fa-credit-card"></i> New Transaction Entry
        </h2>
        <a href="{{ url_for('payments') }}" class="btn btn-secondary btn-sm">
            <i class="fa-solid fa-arrow-left"></i> Back to Payments
        </a>
    </div>

    <div class="card-body">
        <form action="{{ url_for('add_payment') }}" method="POST">
            <div class="form-grid">
                <!-- Member Selection -->
                <div class="form-group full-width">
                    <label for="member_id" class="form-label">Select Member <span class="required">*</span></label>
                    <select id="member_id" name="member_id" class="form-select" required>
                        <option value="">-- Choose Member --</option>
                        {% for m in members %}
                            <option value="{{ m.id }}" {% if request.args.get('member_id') == m.id|string %}selected{% endif %}>
                                {{ m.full_name }} (Phone: {{ m.phone }})
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Amount -->
                <div class="form-group">
                    <label for="amount" class="form-label">Payment Amount (₹) <span class="required">*</span></label>
                    <input type="number" step="0.01" id="amount" name="amount" class="form-control" placeholder="1500.00" required>
                </div>

                <!-- Payment Date -->
                <div class="form-group">
                    <label for="payment_date" class="form-label">Payment Date <span class="required">*</span></label>
                    <input type="date" id="payment_date" name="payment_date" class="form-control" value="{{ today_ymd }}" required>
                </div>

                <!-- Payment Method -->
                <div class="form-group">
                    <label for="payment_method" class="form-label">Payment Method <span class="required">*</span></label>
                    <select id="payment_method" name="payment_method" class="form-select" required>
                        <option value="Cash">Cash</option>
                        <option value="UPI" selected>UPI</option>
                        <option value="Card">Credit / Debit Card</option>
                        <option value="Bank Transfer">Bank Transfer / Net Banking</option>
                    </select>
                </div>

                <!-- Status -->
                <div class="form-group">
                    <label for="status" class="form-label">Payment Status <span class="required">*</span></label>
                    <select id="status" name="status" class="form-select" required>
                        <option value="Paid" selected>Paid</option>
                        <option value="Pending">Pending</option>
                        <option value="Failed">Failed</option>
                    </select>
                </div>

                <!-- Transaction Reference -->
                <div class="form-group full-width">
                    <label for="transaction_id" class="form-label">Transaction ID / Reference Number</label>
                    <input type="text" id="transaction_id" name="transaction_id" class="form-control" placeholder="e.g. UPI-RR-194012 (auto-generated if empty)">
                </div>

                <!-- Notes -->
                <div class="form-group full-width">
                    <label for="notes" class="form-label">Payment Notes / Description</label>
                    <input type="text" id="notes" name="notes" class="form-control" placeholder="e.g. Membership renewal, locker fee, merchandise...">
                </div>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('payments') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-receipt"></i> Save & Generate Receipt
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
