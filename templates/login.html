<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - IronPulse Gym Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-header">
            <div class="login-brand-icon">
                <i class="fa-solid fa-dumbbell"></i>
            </div>
            <h1 class="login-title">IRONPULSE</h1>
            <p class="login-subtitle">Gym Management & Administration Portal</p>
        </div>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        <span>
                            <i class="fa-solid fa-circle-exclamation"></i>
                            {{ message }}
                        </span>
                        <button class="alert-close" onclick="this.parentElement.remove()">&times;</button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group" style="margin-bottom: 18px;">
                <label for="username" class="form-label">
                    <i class="fa-regular fa-user" style="margin-right: 6px;"></i> Username
                </label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-control" 
                    placeholder="Enter your admin username" 
                    required 
                    autofocus
                >
            </div>

            <div class="form-group" style="margin-bottom: 22px;">
                <label for="password" class="form-label">
                    <i class="fa-solid fa-lock" style="margin-right: 6px;"></i> Password
                </label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-control" 
                    placeholder="Enter your admin password" 
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary login-btn">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Dashboard
            </button>
        </form>

        <div class="demo-credentials-box">
            <div style="font-weight: 700; margin-bottom: 4px; color: #fff;">
                <i class="fa-solid fa-key"></i> Default Demo Credentials
            </div>
            <div>Username: <strong>admin</strong></div>
            <div>Password: <strong>admin123</strong></div>
        </div>
    </div>
</body>
</html>
